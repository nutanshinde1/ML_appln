<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback | Campus Café</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="" data-page="feedback" data-root="" >
<div id="site-navbar"></div>
<section class="page-header hdr-beans"><div class="container"><h1>Feedback</h1><p class="mb-0 opacity-75">Tell us what you liked and what we can improve.</p></div></section>

<main class="container py-4 py-lg-5">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card"><div class="card-body p-4">
        <h4 class="mb-3">Share your experience</h4>
        <form id="feedbackForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="fullName">Name</label><input class="form-control" id="fullName" name="fullName" readonly></div>
            <div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" readonly></div>
            <div class="col-12"><label class="form-label d-block">Rating</label>
              <div class="star-rating" role="radiogroup" aria-label="Rating out of 5">
                <input type="radio" name="rating" id="r1" value="1"><label for="r1" title="1 star">★</label>
                <input type="radio" name="rating" id="r2" value="2"><label for="r2" title="2 stars">★</label>
                <input type="radio" name="rating" id="r3" value="3"><label for="r3" title="3 stars">★</label>
                <input type="radio" name="rating" id="r4" value="4"><label for="r4" title="4 stars">★</label>
                <input type="radio" name="rating" id="r5" value="5"><label for="r5" title="5 stars">★</label></div>
              <div class="text-danger small mt-1 d-none" id="ratingError">Please select a rating.</div></div>
            <div class="col-12"><label class="form-label" for="message">Your feedback</label>
              <textarea class="form-control" id="message" name="message" rows="5" required minlength="10" maxlength="500" placeholder="Food quality, service, ordering experience…"></textarea>
              <div class="invalid-feedback">Please write at least 10 characters.</div></div>
            <div class="col-12"><button class="btn btn-primary btn-lg px-4">Submit feedback</button></div>
          </div>
        </form>
      </div></div>
    </div>
    <div class="col-lg-5"><h5 class="mb-3">Recent feedback</h5><div id="feedbackList"></div></div>
  </div>
</main>
<div id="site-footer"></div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
