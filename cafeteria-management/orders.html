<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders | Campus Café</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="" data-page="orders" data-root="" >
<div id="site-navbar"></div>
<section class="page-header hdr-beans"><div class="container"><h1>My Orders</h1><p class="mb-0 opacity-75">Track and review everything you've ordered.</p></div></section>

<main class="container py-4 py-lg-5">
  <div id="ordersEmpty" class="card card-body text-center py-5 d-none">
    <i class="bi bi-receipt display-3 text-muted"></i><h4 class="mt-3">No orders yet</h4><p class="text-muted">Your placed orders will appear here.</p>
    <div><a href="menu.html" class="btn btn-primary">Browse menu</a></div></div>
  <div id="ordersTableWrap">
    <div class="btn-group flex-wrap mb-3" id="statusFilter" role="group" aria-label="Filter by status">
      <button class="btn btn-outline-primary active" data-status="All">All</button><button class="btn btn-outline-primary" data-status="Pending">Pending</button>
      <button class="btn btn-outline-primary" data-status="Preparing">Preparing</button><button class="btn btn-outline-primary" data-status="Ready">Ready</button>
      <button class="btn btn-outline-primary" data-status="Completed">Completed</button><button class="btn btn-outline-primary" data-status="Cancelled">Cancelled</button></div>
    <div class="card"><div class="table-responsive"><table class="table align-middle mb-0">
      <thead class="table-light"><tr><th>Order ID</th><th>Date</th><th class="d-none d-md-table-cell">Items</th><th>Amount</th><th>Status</th><th></th></tr></thead>
      <tbody id="ordersBody"></tbody></table></div></div>
  </div>
</main>
<div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Order details</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body" id="orderModalBody"></div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>
<div id="site-footer"></div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
