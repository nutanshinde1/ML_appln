<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Campus Café</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body class="" data-page="menu" data-root="" >
<div id="site-navbar"></div>
<section class="page-header "><div class="container"><h1>Our Menu</h1><p class="mb-0 opacity-75">Fresh food, ready when you are.</p></div></section>

<main class="container py-4 py-lg-5">
  <div class="menu-toolbar mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-md-7"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" id="searchInput" class="form-control" placeholder="Search dosa, coffee, burger…" aria-label="Search menu"></div></div>
      <div class="col-md-5"><select id="sortSelect" class="form-select" aria-label="Sort items">
        <option value="default">Sort: Recommended</option><option value="popular">Most popular</option><option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option><option value="name">Name: A to Z</option></select></div>
      <div class="col-12"><div class="pills-scroll" id="categoryPills"></div></div>
    </div>
  </div>
  <p class="text-muted" id="resultCount" aria-live="polite"></p>
  <div class="row g-4" id="menuGrid"></div>
  <nav class="mt-4 d-flex justify-content-center" aria-label="Menu pages"><ul class="pagination" id="pagination"></ul></nav>
</main>
<div id="site-footer"></div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
