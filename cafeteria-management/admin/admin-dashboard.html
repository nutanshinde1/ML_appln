<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Café Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-page="admin-dashboard" data-root="../" data-title="Dashboard">
<div class="admin-layout"><aside id="adminSidebar" class="admin-sidebar"></aside>
<div class="admin-main"><div id="adminTopbar"></div>
<main class="p-3 p-lg-4">
<div class="row g-3 mb-4" id="statCards"></div>
<div class="row g-4">
  <div class="col-xl-8">
    <div class="card mb-4"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Recent orders</h5><a href="admin-orders.html" class="btn btn-sm btn-outline-primary">View all</a></div>
      <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody id="recentBody"></tbody></table></div></div></div>
    <div class="card"><div class="card-body"><h5 class="mb-3">Revenue, last 7 days <span class="small text-muted">(demo data)</span></h5><div class="bar-chart" id="revenueChart"></div></div></div>
  </div>
  <div class="col-xl-4">
    <div class="card mb-4"><div class="card-body"><h5 class="mb-3">Popular food items</h5><div id="popularList"></div></div></div>
    <div class="card"><div class="card-body"><h6>Demo data</h6><p class="small text-muted">All numbers come from sample data stored in this browser, not a database.</p>
      <button class="btn btn-sm btn-outline-danger" id="resetDemo"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset demo data</button></div></div>
  </div>
</div>
</main></div></div>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/mockData.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
