<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Campus Café</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="" data-page="admin-login" data-root="../" >
<div class="admin-auth"><div class="card auth-card shadow-lg" style="max-width:420px;width:100%"><div class="card-body p-4">
  <div class="text-center mb-3"><div class="brand fs-3"><i class="bi bi-cup-hot-fill text-primary me-2"></i>Café Admin</div><p class="text-muted mb-0">Sign in to manage the cafeteria</p></div>
  <div id="formMessage"></div>
  <form id="adminLoginForm" novalidate>
    <div class="mb-3"><label class="form-label" for="email">Admin email</label><input type="email" class="form-control" id="email" name="email" required autocomplete="username"><div class="invalid-feedback">Enter a valid email.</div></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" required autocomplete="current-password"><div class="invalid-feedback">Password is required.</div></div>
    <button class="btn btn-primary w-100 btn-lg">Sign in</button>
  </form>
  <div class="demo-box mt-3"><strong>Demo credentials</strong> (frontend demo only, not secure authentication)<br>admin@cafeteria.com / admin123
    <button type="button" class="btn btn-sm btn-outline-primary ms-1" id="fillAdmin">Fill in</button></div>
  <p class="text-center mt-3 mb-0 small"><a href="../index.html"><i class="bi bi-arrow-left me-1"></i>Back to customer site</a></p>
</div></div></div>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/mockData.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
