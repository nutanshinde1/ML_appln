<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | Café Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-page="admin-orders" data-root="../" data-title="Orders">
<div class="admin-layout"><aside id="adminSidebar" class="admin-sidebar"></aside>
<div class="admin-main"><div id="adminTopbar"></div>
<main class="p-3 p-lg-4">
<div class="card"><div class="card-body">
  <div class="row g-2 mb-3">
    <div class="col-md-6"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input id="orderSearch" class="form-control" placeholder="Search by order ID or customer" aria-label="Search orders"></div></div>
    <div class="col-md-3"><select id="orderStatusFilter" class="form-select" aria-label="Status filter"><option value="">All statuses</option><option>Pending</option><option>Preparing</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select></div>
  </div>
  <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Order</th><th>Customer</th><th class="d-none d-lg-table-cell">Items</th><th>Amount</th><th class="d-none d-md-table-cell">Date</th><th>Status</th><th></th></tr></thead><tbody id="ordersBody"></tbody></table></div>
  <nav class="mt-3 d-flex justify-content-center" aria-label="Orders pages"><ul class="pagination mb-0" id="ordersPager"></ul></nav>
</div></div>
<div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Order details</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body" id="orderModalBody"></div>
  <div class="modal-footer justify-content-between"><div class="d-flex gap-2 align-items-center"><label class="small text-muted" for="modalStatus">Status</label><select id="modalStatus" class="form-select form-select-sm" style="width:auto"></select></div>
    <div><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button> <button class="btn btn-primary" id="saveStatus">Update status</button></div></div></div></div></div>
</main></div></div>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/mockData.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
