<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Items | Café Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-page="admin-items" data-root="../" data-title="Food Items">
<div class="admin-layout"><aside id="adminSidebar" class="admin-sidebar"></aside>
<div class="admin-main"><div id="adminTopbar"></div>
<main class="p-3 p-lg-4">
<div class="card"><div class="card-body">
  <div class="row g-2 mb-3 align-items-center">
    <div class="col-md-4"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input id="itemSearch" class="form-control" placeholder="Search items" aria-label="Search items"></div></div>
    <div class="col-12 col-md-3"><select id="itemCatFilter" class="form-select" aria-label="Category filter"></select></div>
    <div class="col-12 col-md-2"><select id="itemStatusFilter" class="form-select" aria-label="Status filter"><option value="">All status</option><option>Available</option><option>Unavailable</option></select></div>
    <div class="col-md-3 text-md-end"><button class="btn btn-primary" id="addItemBtn"><i class="bi bi-plus-lg me-1"></i>Add item</button></div>
  </div>
  <div class="small text-muted mb-2" id="itemsCount"></div>
  <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Item</th><th class="d-none d-md-table-cell">Category</th><th>Price</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody id="itemsBody"></tbody></table></div>
  <nav class="mt-3 d-flex justify-content-center" aria-label="Items pages"><ul class="pagination mb-0" id="itemsPager"></ul></nav>
</div></div>
<div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <form id="itemForm" novalidate>
    <div class="modal-header"><h5 class="modal-title" id="itemModalTitle">Add food item</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><input type="hidden" name="itemId">
      <div class="row g-3">
        <div class="col-12"><label class="form-label" for="f_name">Name</label><input class="form-control" id="f_name" name="name" required minlength="2"><div class="invalid-feedback">Name is required.</div></div>
        <div class="col-md-6"><label class="form-label" for="f_cat">Category</label><select class="form-select" id="f_cat" name="categoryId" required></select><div class="invalid-feedback">Select a category.</div></div>
        <div class="col-md-6"><label class="form-label" for="f_price">Price (₹)</label><input type="number" class="form-control" id="f_price" name="price" min="1" max="5000" required><div class="invalid-feedback">Enter a price between 1 and 5000.</div></div>
        <div class="col-md-6"><label class="form-label" for="f_emoji">Emoji icon</label><input class="form-control" id="f_emoji" name="emoji" maxlength="4" placeholder="🍔"></div>
        <div class="col-md-6"><label class="form-label" for="f_status">Status</label><select class="form-select" id="f_status" name="status"><option>Available</option><option>Unavailable</option></select></div>
        <div class="col-12"><label class="form-label" for="f_desc">Description</label><textarea class="form-control" id="f_desc" name="description" rows="3" required minlength="10"></textarea><div class="invalid-feedback">Add a short description (10+ characters).</div></div>
        <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_pop" name="popular"><label class="form-check-label" for="f_pop">Show as popular item</label></div></div>
      </div></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save item</button></div>
  </form></div></div></div>
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Delete food item?</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">Are you sure you want to delete <strong id="delName"></strong>? This cannot be undone.</div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" id="confirmDelete">Delete</button></div></div></div></div>
</main></div></div>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/mockData.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
